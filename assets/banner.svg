<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="50%" style="stop-color:#1e1b4b"/>
      <stop offset="100%" style="stop-color:#0f172a"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#38bdf8"/>
      <stop offset="50%" style="stop-color:#a78bfa"/>
      <stop offset="100%" style="stop-color:#f472b6"/>
    </linearGradient>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#38bdf8" stop-opacity="0.9"/>
      <stop offset="100%" style="stop-color:#818cf8" stop-opacity="0.9"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="320" fill="url(#bgGrad)"/>
  
  <!-- Decorative circles -->
  <circle cx="100" cy="80" r="60" fill="#38bdf8" opacity="0.06"/>
  <circle cx="1100" cy="240" r="80" fill="#a78bfa" opacity="0.07"/>
  <circle cx="900" cy="60" r="40" fill="#f472b6" opacity="0.05"/>
  
  <!-- Waveform decoration left -->
  <path d="M40 160 Q70 100 100 160 Q130 220 160 160 Q190 100 220 160 Q250 220 280 160" 
        fill="none" stroke="url(#waveGrad)" stroke-width="4" stroke-linecap="round" opacity="0.7"/>
  
  <!-- Main title -->
  <text x="600" y="140" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" 
        font-size="96" font-weight="800" fill="url(#textGrad)">VCB</text>
  
  <!-- Subtitle -->
  <text x="600" y="190" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" 
        font-size="28" font-weight="500" fill="#cbd5e1">Voice Conversion Binary</text>
  
  <!-- Tagline -->
  <text x="600" y="235" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" 
        font-size="18" fill="#94a3b8">Convert speech → .vcb · Speak with any voice · Python + JS</text>
  
  <!-- Bottom bar -->
  <rect y="300" width="1200" height="20" fill="#0f172a"/>
  <text x="600" y="314" text-anchor="middle" font-family="system-ui,sans-serif" 
        font-size="12" fill="#64748b">Copyright © 2026 DarkFox / DarkFox Co. · MIT License</text>
</svg>
